[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Long Uzbek UI strings and callback labels are natural in these files.
"app/bot/keyboards/*" = ["E501"]
"app/bot/handlers/admin/*" = ["E501"]
"app/bot/handlers/genres.py" = ["E501"]
"app/bot/handlers/movie.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false